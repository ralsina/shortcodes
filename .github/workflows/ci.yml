name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ragel
          shards install
      - name: Check generated C is up to date
        run: |
          cd src
          ragel -G2 shortcodes.rl -o shortcodes.c
          git diff --exit-code shortcodes.c
      - name: Build binding
        run: make binding
      - name: Run specs
        run: crystal spec
      - name: Lint
        uses: crystal-ameba/github-action@master
        with:
          version: 1.7.0
