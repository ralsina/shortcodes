name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install dependencies
        run: shards install
      # The committed shortcodes.c is generated with ragel 7, which fixes
      # 6.x bugs we rely on. Distros ship 6.10, so CI must NOT regenerate;
      # touch it so make compiles the committed file as-is.
      - name: Build binding
        run: |
          touch src/shortcodes.c
          make binding
      - name: Run specs
        run: crystal spec
      - name: Lint
        uses: crystal-ameba/github-action@master
        with:
          version: 1.7.0
